name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    container: archlinux:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Install clang-format
        run: |
          pacman -Syu --noconfirm --needed archlinux-keyring
          pacman -S --noconfirm --needed git clang

      - name: Checkout
        uses: actions/checkout@v6

      - name: Check formatting
        run: |
          find include src \
            -type f \( -name '*.hpp' -o -name '*.h' -o -name '*.cpp' -o -name '*.cc' -o -name '*.cxx' \) \
            -print0 | xargs -0 clang-format --dry-run --Werror

  build-linux:
    name: Build / Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Install Linux system dependencies
        run: |
          pacman -Syu --noconfirm --needed archlinux-keyring
          pacman -S --noconfirm --needed \
            base-devel \
            git \
            cmake \
            ninja \
            pkgconf \
            autoconf \
            autoconf-archive \
            automake \
            libtool \
            zstd \
            curl \
            zip \
            unzip \
            tar \
            ca-certificates \
            libx11 \
            libxext \
            libxrandr \
            libxrender \
            libxfixes \
            libxi \
            libxcursor \
            libxinerama \
            wayland \
            libxkbcommon \
            dbus \
            mesa \
            libxtst

      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore vcpkg cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/vcpkg
          key: Linux-vcpkg-${{ hashFiles('vcpkg.json', 'CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            Linux-vcpkg-

      - name: Bootstrap Linux
        run: ./scripts_linux/bootstrap.sh

      - name: Build Linux
        run: ./scripts_linux/build.sh all

  build-windows:
    name: Build / windows-2025-vs2026
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore vcpkg cache
        uses: actions/cache@v5
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: Windows-vcpkg-${{ hashFiles('vcpkg.json', 'CMakeLists.txt', 'CMakePresets.json') }}
          restore-keys: |
            Windows-vcpkg-

      - name: Bootstrap Windows
        shell: cmd
        run: call scripts_windows\bootstrap.bat

      - name: Build Windows
        shell: cmd
        run: call scripts_windows\build.bat all
